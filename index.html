<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sympal | TestFlight waitlist</title>
<meta name="description" content="Your new pro camera, join the TestFlight waitlist">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0c0b">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  /* the app's own palette */
  --bg:#0c0c0b;
  --ink:#f2f2f0;
  --muted:rgba(242,242,240,.56);
  --faint:rgba(242,242,240,.28);
  --field:rgba(242,242,240,.07);
  --edge:rgba(242,242,240,.14);
  --err:#ff7a66;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --gutter:clamp(16px,2.4vw,32px);
  --rw:clamp(84px,8vw,120px);
  --mark:clamp(92px,8.4vw,128px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* the ring: the Sympal mark in the middle, rolls of film going round it.
   Each roll is a strip of sixteen rendered frames — 0 lying on its side,
   7 standing, 15 with its film pulled out */
.ring{position:fixed;left:0;top:0;width:0;height:0;z-index:2}
.mark{position:absolute;left:0;top:0;width:var(--mark);aspect-ratio:1;margin:calc(var(--mark) / -2) 0 0 calc(var(--mark) / -2);z-index:1000;will-change:transform;pointer-events:none}
.mark img{display:block;width:100%;height:100%;opacity:0;transform:scale(.82);transition:opacity .7s,transform 1s cubic-bezier(.2,.7,.2,1)}
.mark.shown img{opacity:1;transform:none}
.roll{position:absolute;left:0;top:0;width:var(--rw);aspect-ratio:1;margin:calc(var(--rw) / -2) 0 0 calc(var(--rw) / -2);will-change:transform;cursor:grab;user-select:none}
.roll .face{position:absolute;inset:0;background-size:1600% 100%;background-repeat:no-repeat;background-position:0 0;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.roll:hover .face{transform:translateY(-6px) scale(1.06)}
.dragging .roll{cursor:grabbing}

/* page */
main{position:relative;z-index:3;min-height:100svh;display:flex;flex-direction:column;pointer-events:none}
.mark-slot{flex:none;height:clamp(400px,62svh,640px)}
.content{pointer-events:auto;width:min(460px,100% - 2 * var(--gutter));margin:0 auto;padding-bottom:72px;display:flex;flex-direction:column;align-items:center;gap:26px;opacity:0;transform:translateY(14px);transition:opacity 1.1s,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.ready .content{opacity:1;transform:none}
.title{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.name{font-size:clamp(32px,3vw,40px);font-weight:600;line-height:1;letter-spacing:-.03em}
.tagline{font-size:clamp(17px,1.6vw,20px);line-height:1.3;letter-spacing:-.01em;color:var(--muted)}

form.join{width:100%;display:flex;flex-direction:column;gap:14px}
.beta{font-size:13px;color:var(--muted);text-align:center}
.field{display:flex;align-items:center;gap:6px;height:56px;padding:6px;border-radius:999px;background:var(--field);box-shadow:inset 0 0 0 1px var(--edge);transition:box-shadow .2s}
.field:focus-within{box-shadow:inset 0 0 0 1px var(--faint)}
.field input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font:inherit;font-size:16px;padding:0 0 0 16px;color:var(--ink)}
.field input::placeholder{color:var(--faint)}
.field button{flex:none;height:100%;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:inherit;font-weight:600;font-size:15px;letter-spacing:-.01em;padding:0 22px;cursor:pointer;transition:opacity .2s,transform .2s}
.field button:hover{opacity:.88}
.field button:active{transform:scale(.97)}
.field button:disabled{opacity:.5;cursor:default}
.consent{display:flex;gap:10px;align-items:flex-start;padding:0 8px;font-size:12.5px;color:var(--muted);cursor:pointer}
.consent input{appearance:none;flex:none;width:18px;height:18px;margin-top:-1px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--faint);display:grid;place-items:center;cursor:pointer;background:none}
.consent input:checked{background:var(--ink);box-shadow:none}
.consent input:checked::after{content:"";width:4px;height:8px;border:solid var(--bg);border-width:0 1.6px 1.6px 0;transform:rotate(45deg) translate(-1px,-1px)}
.consent input:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.msg{min-height:1.2em;padding:0 8px;font-size:12.5px}
.msg.err{color:var(--err)}
.done-note{display:none;font-size:18px;letter-spacing:-.01em;text-align:center}
form.join.done > :not(.done-note){display:none}
form.join.done .done-note{display:block}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;gap:6px;padding:12px var(--gutter);font-size:11px;color:var(--faint);pointer-events:none}
.foot span + a::before{content:"·";margin-right:6px}
.foot a{pointer-events:auto;text-decoration:none}
.foot a:hover{color:var(--ink)}

@media (max-width:700px){
  :root{--rw:62px;--mark:70px}
  .mark-slot{height:clamp(300px,46svh,420px)}
  .content{padding-bottom:88px;gap:22px}
  .foot{background:linear-gradient(transparent,var(--bg) 40%)}
}
</style>
</head>
<body>
<div class="ring" id="ring" aria-hidden="true">
  <div class="mark" id="mark"><img src="sympal.webp" alt="" width="320" height="320"></div>
</div>

<main>
  <div class="mark-slot" id="slot"></div>
  <section class="content">
    <div class="title">
      <h1 class="name">sympal</h1>
      <p class="tagline">Your new pro camera</p>
    </div>

    <form class="join" novalidate>
      <p class="beta">Join the waitlist for the TestFlight beta</p>
      <label class="field">
        <span class="sr">Email address</span>
        <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        <button type="submit">Join</button>
      </label>
      <label class="consent">
        <input type="checkbox" name="consent" required>
        <span>Sympal may keep this address to send me a TestFlight invite, and for nothing else</span>
      </label>
      <div class="msg" role="status" aria-live="polite"></div>
      <p class="done-note" role="status">You're on the list, your TestFlight invite will come by email</p>
    </form>
  </section>
</main>

<footer class="foot">
  <span>© 2026 Sympal</span>
  <a href="#">Privacy policy</a>
</footer>

<script>
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = s => document.querySelector(s);
const ring = $("#ring"), slot = $("#slot"), mark = $("#mark");
const wait = ms => new Promise(r => setTimeout(r, ms));
const clamp01 = t => Math.min(Math.max(t, 0), 1);
const ease = t => 1 - Math.pow(1 - clamp01(t), 3);

// ---------- the rolls: each look once, the colours spread round the ring ----------
const LOOKS = ["800X", "C800", "GR100", "S70", "A400", "HG6", "T400"];
const LYING = 0, STANDING = 7, OPEN = 15, LAST = 15;
const rolls = LOOKS.map(look => {
  const el = document.createElement("div");
  el.className = "roll";
  el.innerHTML = `<div class="face" style="background-image:url(rolls/${look}.webp)"></div>`;
  ring.appendChild(el);
  const roll = { el, face: el.firstChild, spawn: 0, frame: LYING, shown: -1, next: 0, hover: false };
  el.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") roll.hover = true; });
  el.addEventListener("pointerleave", () => { roll.hover = false; });
  return roll;
});
const N = rolls.length, STEP = (Math.PI * 2) / N;
// The roll at the front of the ring is the chosen one, as in the app.
const FRONT = Math.cos(STEP / 2);

// Loaded before the intro, so nothing comes out of the mark empty.
const load = src => new Promise(done => {
  const img = new Image();
  img.onload = img.onerror = done;
  img.src = src;
});
const images = Promise.all([...LOOKS.map(look => load(`rolls/${look}.webp`)), load("sympal.webp")]);

// ---------- ring geometry ----------
let cx = 0, cy = innerHeight / 2, cyTo = cy, centred = true, rx = 300, ry = 80, rz = 200;
function layout() {
  const r = slot.getBoundingClientRect();
  cx = innerWidth / 2;
  cyTo = centred ? innerHeight / 2 : r.top + r.height * 0.47;
  const small = innerWidth < 700;
  rx = Math.min(innerWidth * (small ? 0.4 : 0.3), 440);
  ry = rx * (small ? 0.62 : 0.34);
  rz = rx * 0.6;
}
layout();
addEventListener("resize", layout);
addEventListener("scroll", layout, { passive: true });

// ---------- a roll's frame: it stands up as it comes out, and pulls its film
// out at the front (or under the pointer), then winds it back ----------
function film(c, front, now) {
  let target;
  if (c.spawn < 1) {
    c.frame = Math.min(STANDING, Math.floor(clamp01(c.spawn) * (STANDING + 1)));
    target = c.frame;
  } else {
    target = front || c.hover ? OPEN : STANDING;
  }
  if (REDUCED) {
    c.frame = target;
  } else if (c.frame !== target && now >= c.next) {
    const out = target > c.frame;
    c.frame += out ? 1 : -1;
    // the set's own rate going out, twice that winding back
    c.next = now + (out ? 1000 / 12 : 1000 / 24);
  }
  if (c.frame !== c.shown) {
    c.face.style.backgroundPosition = `${(c.frame / LAST) * 100}% 0`;
    c.shown = c.frame;
  }
}

// ---------- motion: steady spin, plus drag / wheel with inertia ----------
let angle = 0, vel = 0, spread = 0;
const BASE = REDUCED ? 0 : -0.0035;
function frame(now) {
  requestAnimationFrame(frame);
  vel *= 0.94;
  angle += BASE + vel;
  cy += (cyTo - cy) * (REDUCED ? 1 : 0.05);
  mark.style.transform = `translate3d(${cx}px,${cy}px,0)`;
  const persp = 1600;
  for (let i = 0; i < N; i++) {
    const c = rolls[i];
    const t = i * STEP + angle;
    // seen slightly from above: the front of the ring sits lower
    const x = Math.sin(t) * rx, y = Math.cos(t) * ry + Math.sin(t * 2) * ry * 0.08, z = Math.cos(t) * rz;
    const s = ease(c.spawn);
    const k = persp / (persp - z * spread);                   // perspective scale
    const px = cx + x * spread * k, py = cy + y * spread * k;
    c.el.style.transform = `translate3d(${px}px,${py}px,0) scale(${(0.35 + 0.65 * s) * k * (0.78 + 0.22 * spread)})`;
    // Solid all the way round: a see-through roll showed the one behind it.
    c.el.style.opacity = clamp01(c.spawn * 5);
    // In front of the mark at the front of the ring, behind it at the back.
    c.el.style.zIndex = Math.round(1000 + z);
    film(c, spread > 0.99 && Math.cos(t) > FRONT, now);
  }
}

let drag = null;
addEventListener("pointerdown", e => {
  if (!e.target.closest(".roll")) return;
  drag = { x: e.clientX };
  document.body.classList.add("dragging");
});
addEventListener("pointermove", e => {
  if (!drag) return;
  vel = (e.clientX - drag.x) * 0.0009;
  drag.x = e.clientX;
}, { passive: true });
addEventListener("pointerup", () => { drag = null; document.body.classList.remove("dragging"); });
addEventListener("wheel", e => { if (!REDUCED) vel -= Math.sign(e.deltaY) * 0.004; }, { passive: true });

// ---------- intro: the mark in the middle of the screen, the rolls come out
// of it, and the whole ring rises to its place over the words ----------
async function intro() {
  await images;
  layout();
  requestAnimationFrame(frame);

  if (REDUCED) {
    rolls.forEach(c => (c.spawn = 1));
    spread = 1;
    centred = false;
    layout();
    mark.classList.add("shown");
    document.documentElement.classList.add("ready");
    return;
  }

  await wait(50);
  mark.classList.add("shown");
  await wait(850);
  // rolls spring out of the mark one after another, standing up as they go
  const start = performance.now();
  (function grow(now) {
    const t = now - start;
    spread = ease(t / 1600);
    rolls.forEach((c, i) => (c.spawn = (t - i * 110) / 700));
    if (t < 2400) requestAnimationFrame(grow);
  })(start);
  await wait(1700);
  centred = false;
  layout();
  await wait(900);
  document.documentElement.classList.add("ready");
}
rolls.forEach(c => (c.el.style.opacity = 0));
intro();

// ---------- waitlist form ----------
// The waitlist service's form address (Buttondown, Loops, Formspree…).
// Empty, the form thanks people and sends nothing anywhere.
const ENDPOINT = "";
const form = $("form.join");
form.addEventListener("submit", async e => {
  e.preventDefault();
  const msg = form.querySelector(".msg");
  const button = form.querySelector("button");
  msg.className = "msg";
  msg.textContent = "";
  const email = form.email.value.trim();
  let err = "";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) err = "That email address doesn't look right";
  else if (!form.consent.checked) err = "Tick the box so we can send you the invite";
  if (err) { msg.textContent = err; msg.classList.add("err"); return; }
  if (ENDPOINT) {
    button.disabled = true;
    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { Accept: "application/json" },
        body: new URLSearchParams({ email })
      });
      if (!res.ok) throw new Error(res.status);
    } catch {
      msg.textContent = "Couldn't add you just now, please try again";
      msg.classList.add("err");
      button.disabled = false;
      return;
    }
  } else {
    console.warn("Waitlist: no ENDPOINT set, so this address was not saved");
  }
  form.classList.add("done");
  vel = -0.08;   // a quick spin as a thank you
});
</script>
</body>
</html>
